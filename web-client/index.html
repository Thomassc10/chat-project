<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            
            <div id="authMenuView">
                <h2>Welcome to Chat</h2>
                <div class="auth-buttons">
                    <button id="showLoginBtn">Log in</button>
                    <button id="showRegisterBtn" class="secondary-btn">Create account</button>
                </div>
            </div>

            <div id="loginView" style="display: none;">
                <h2>Log In</h2>
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
                
                <div class="password-wrapper">
                    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                    <button type="button" class="toggle-password-btn">👁️</button>
                </div>
                
                <p id="loginError" class="error-text" style="display: none;"></p>
                <button id="submitLoginBtn">Log in</button>
                <button id="backToMenuFromLogin" class="text-btn">Back</button>
            </div>

            <div id="registerView" style="display: none;">
                <h2>Create Account</h2>
                <input type="text" id="regUsername" placeholder="Username" autocomplete="username">
                
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password">
                    <button type="button" class="toggle-password-btn">👁️</button>
                </div>
                
                <div class="password-wrapper">
                    <input type="password" id="regPasswordConfirm" placeholder="Repeat Password" autocomplete="new-password">
                    <button type="button" class="toggle-password-btn">👁️</button>
                </div>
                
                <p id="regError" class="error-text" style="display: none;"></p>
                <button id="submitRegBtn">Create Account</button>
                <button id="backToMenuFromReg" class="text-btn">Back</button>
            </div>

        </div>
    </div>
    <div class="app-container">
        <header class="top-bar">
            <h2>Chat App</h2>
            <button id="darkModeBtn">Dark Mode</button>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Chats</h3>
                    <button id="addContactBtn">+ Add Contact</button>
                </div>
                <ul id="chatList" class="chat-list">
                    </ul>
            </aside>

            <main class="chat-area" id="chatArea">
                <div class="chat-header" id="chatHeader" style="display: none;">
                    <div class="contact-info">
                        <div class="contact-avatar" id="contactAvatar"></div>
                        <h2 id="contactName">Contact Name</h2>
                    </div>
                    <button id="editContactBtn">Edit</button>
                </div>

                <div class="messages-display" id="messagesDisplay" style="display: none;">
                    </div>

                <div class="input-bar" id="inputBar" style="display: none;">
                    <button id="fileBtn">File</button>
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendBtn">Send</button>
                </div>
                
                <div class="no-chat-selected" id="noChatSelected">
                    <p>Select a chat to start messaging</p>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
